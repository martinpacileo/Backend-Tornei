services:
  db:
    image: postgres:16-alpine
    container_name: tornei_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tornei
      POSTGRES_PASSWORD: tornei_secret
      POSTGRES_DB: tornei_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
